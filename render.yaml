services:
  - type: web
    name: aurex-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NEW_API_KEY
        sync: false
      - key: SEEK_AI_MODEL
        value: claude-opus-5
      - key: SEEK_AI_URL
        value: https://seekai.cc/v1/messages
